; DSR Lighting Engine per-map settings. Every install replaces this file, so edits here are lost.
; Put your own in dsrle.ini under a section of the same name: a key there wins over the same key here.
; Keys carry their section name. A key a map does not list keeps its value from dsrle.ini.

; Depths
[map.m10_00]
lightreach.reach = 1

; Undead Burg and Parish
[map.m10_01]
lighting.point_gain = 1.0

; Darkroot Garden and Basin
[map.m12_00]
lightreach.reach = 1
lighting.point_gain = 1.3

; Anor Londo
[map.m15_01]
volumetrics.haze_density = 0.000025
volumetrics.light_density = 0.0015
volumetrics.max_glow = 0.025
