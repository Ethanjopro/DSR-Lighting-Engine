why = "sens_bridge (and sens) outdoor char row 10, eased in round 2: 25/15 -> 24/14 (x0.96/x0.93; round 1 was x0.8 = 20/12). Round 1 measured sens_bridge char -0.49 (repeat -0.001) vs -0.35..+0.10: about -0.15 of it is the sun 50 -> 33 (Phase-0 vs re-baseline char -0.26 is the vanilla sun's share), -0.03 the row-0 background, ~-0.3 the row-10 fill+env cuts. This keeps ~25% of those cuts in log terms; with the envDif/envSpc ease below, predicted char -0.18..-0.26"

