# G1 round 1 (W3): Undead Burg, Undead Parish, Firelink Shrine, Depths. Drafted before measurement; W4 captures
# and iterates. Source of every number: looks/G1.md lever recipes (middle of range), corrected by looks/README.md
# (P2: LightBank-only colA_s classes off 0 / low ~25 / mid ~40; S1: rows 2/3/4 are spec-only and stay vanilla;
# P9: every live row with 0 < colA_s <= 60 gets a decision here). Colour moves resting on unverified sources and
# the optional depths_dragon shaft live in three sign-off files, each droppable on its own:
# a10_burg_parish_signoff.toml (Burg/Parish cooling), a10_firelink_signoff.toml (Firelink green),
# a10_depths_signoff.toml (depths_dragon shaft experiment).
#
# EV estimates use data/sweep_sensitivity.json per doubling: ambient (colA_u+colA_d) parish 2.05 / firelink 0.58,
# grayKey parish 1.75 / firelink 1.04 (from the x1.5 point), shadow endDist firelink -0.12, bloom firelink +0.12.
# Different u/d ratios are combined by c7/c8 energy (colA^2.2) weighting, then converted back to colA doublings.
# Burg, the altar and the Depths use the parish proxy (bible) with the firelink proxy as the lower bound.
#
# NOT SHIPPABLE ALONE for the colour targets of burg, parish and parish_altar (W3 fixer note). This file only cuts
# fill and adds a warm low sun: cutting the cool row-10 fill (u 220/240/255) while the warm fire stays, plus the warm
# sun tint, moves b WARMER (direction up, size not modelled, probably +0.000..+0.003) against their cooling targets
# (b -0.008..-0.002; parish -0.012..+0.001). The cooling lives in a10_burg_parish_signoff.toml.
# Pair watch (W4): burg -0.19 (parish proxy) / +0.01 (firelink proxy) vs parish about -0.36 can reach +0.37 against
# +-0.30, and depths - burg can reach -0.29 against >= -0.30. None of the three has its own sweep: if burg lands within
# -0.05 of vanilla while parish is below -0.30, step parish (row 11), not burg.
# Guard views with no baseline, to capture vanilla and tuned in the W4 session: lower_burg_capra (ToneMap 10, row 36),
# firelink_abyss_entrance (ToneMap/ShadowBank 20, rows 24/29).

area = "a10"

# ---------------------------------------------------------------------------------------------------------------
# m10_01 Undead Burg / Undead Parish (views burg, parish, parish_altar). Rows 10/11/15/17 and ToneMap 10/11 are
# m10_01 only. Not touched: LightBank 16, Fog 11, Scatter 11 (shared with m10_02 Firelink), rows 1/2 of
# ToneMap/ToneCorrect/Shadow and Fog/Scatter 1 (shared with the Depths), Hellkite ShadowBank 13, Capra row 36 fill.

[[edit]]
bank = "LightBank"
rows = [10, 15, 17]
op = "mul"
fields = { colA_u = 0.91, colA_d = 0.80 }
why = "burg/parish_altar: less flat exterior fill, ground bounce cut more than sky (G1 row 10 u x0.88-0.95, d x0.75-0.85); char rows 15/17 track row 10 so characters keep sitting in the scene. Est. row-10 views -0.11..-0.39 EV before the ToneMap 10 recovery"

[[edit]]
bank = "LightBank"
rows = [11]
op = "set"
fields = { colA_u = 31, colA_d = 14 }
why = "parish ev -0.50..-0.05, p90 >= 86 (and Burg interiors): darker indoor fill with corner separation, d cut more (G1 x0.80-0.88: colA_u 35->31 = round(x0.88), colA_d 16->14 x0.875). Sized to land without a grayKey recovery (W3 fixer): est. -0.36 EV by the parish sweep, energy-weighted. ToneMap 11 stays vanilla so the unchanged shared char row 16 is not lifted against the de-glow goal. If W4 lands parish above -0.20, step this row to x0.85 rather than touching row 16"

[[edit]]
bank = "ToneMapBank"
rows = [10]
op = "set"
fields = { grayKeyValue = 0.27 }
why = "burg/parish_altar: recover exposure after the row-10 fill cut (grayKey 0.25->0.27, x1.08, est. +0.12..+0.20 EV; the cut alone reaches burg's -0.40 floor). bloomMul held at 10 (bible x1.0-1.3 optional): with the daylight firelink/anor sweeps the grayKey alone costs clip +0.18..+0.54 against burg's +0.5. Also reaches lower_burg_capra (guard view, hold +-0.15) if its collision selects ToneMap 10"

