# G3 round 2 (W4, after the round-1 capture in captures/w4r1): Blighttown/Quelaag (m14_00) and Demon Ruins/Lost
# Izalith (m14_01). Round 2 changes only the izalith_2 de-sheen (row 12 removed, row 15 added); the rest is round 1.
# The Blighttown lift is sign-off gated and lives in a14_blighttown_signoff.toml. Quelaag holds.
# Sources: looks/G3.md sections 3 and 8-11, looks/README.md sections 2-4 and 8, looks/targets.json.
area = "a14"

# --- Sun decisions (README 4.3 rule 7 / P9) ---------------------------------------------------
# The only live a14 rows with 0 < vanilla colA_s <= 60 are 14, 20, 28, 29 (all 50). The 100-rows are spec-only under
# shader gate S1 and stay vanilla. None of the four carries a Water material, so 0 is vanilla-neutral.
[[edit]]
bank = "LightBank"
rows = [14, 28]
op = "set"
fields = { colA_s = 0 }
why = "sun off in the lava caverns (demon_ruins_1/3, izalith_1/2): rows 14 'Lava' and 28 'Seal Spear' are non-light-mapped A14_lava_M[DB] meshes plus objects that would take a 0.435 sun"

[[edit]]
bank = "LightBank"
rows = [20, 29]
op = "set"
fields = { colA_s = 0 }
why = "sun off in Blighttown (blighttown_bridge/swamp, quelaag: cavern, no sky): row 20 sky dome M[D], row 29 'White Sticky Thing' M[D]_Alp, both non-light-mapped"

# --- Demon Ruins 1: less flat IBL fill on the stone, lava keeps its glow ------------------------
# Row 6 'Festering Upper': 30 map pieces, 28 objects, 7 characters, 37 collisions (places 1410/1411).
# colA_u held at x1.0 (recipe x1.0-1.1): the envDif cut alone stays inside the DR1 range, and fewer edits.
[[edit]]
bank = "LightBank"
rows = [6]
op = "mul"
fields = { envDif_colA = 0.9 }
why = "demon_ruins_1 ev -0.2..+0.15: cut excess environment diffuse so the lava is the key (200 -> 180)"

[[edit]]
bank = "ToneMapBank"
rows = [6]
op = "mul"
fields = { bloomMulFar = 1.1 }
why = "demon_ruins_1 p99 >= -3, clip <= +1: lava reads at range (480 -> 528), never below vanilla"

# --- Lost Izalith 1: lava bloom only --------------------------------------------------------------
# ToneMap 7 'Ruined City' (21 collisions + 3 connect, places 1410/1411).
[[edit]]
bank = "ToneMapBank"
rows = [7]
op = "mul"
fields = { bloomMul = 1.125 }
why = "izalith_1 p99 >= -3, clip <= +1: lava bloom that reads at range (80 -> 90); Light and ToneCorrect hold"

# --- Lost Izalith 2: cut the cyan IBL sheen on the character ------------------------------------
# Round 1 put this on LightBank 12 'Izalith' (colA_u x0.95, envSpc_colA x0.9). It was a no-op at izalith_2: static
# character and environment pixels moved by a median of 0.000 (d_char_env -0.008 / -0.022 over two captures of the
# identical a14_g3 build). So row 12 lights neither the bonfire character nor the visible map there, and the edit only
# changed 14 map pieces and 101 objects elsewhere. Removed in round 2.
# Round-1 nulls also exclude LightBank 6 (DR1's envDif cut moved DR1 by -0.10 EV but not izalith_2). Of the other
# m14_01 rows with place-1411 collisions, 7 has a pink envSpc (255/155/155), while 8 and 15 have the cyan envSpc that
# the izalith_2 armour sheen shows. Row 15 'Lower Ruins' (23 collisions + 4 objects, no map pieces) has the
# character-row shape, and looks/G3.md already names it for the DR3 de-sheen ('if row 15 is the character row').
# INFERRED ROW (like row 42 in round 1): if izalith_2 does not move in round 2, the row is 8; then revert this edit.
[[edit]]
bank = "LightBank"
rows = [15]
op = "mul"
fields = { envDif_colA = 0.85, envSpc_colA = 0.8 }
why = "izalith_2 d_char_env -0.4..-0.05: cut the cyan IBL sheen on the character (envDif 300 -> 255, envSpc 150 -> 120). Inferred row: round 1 showed rows 6 and 12 are not live at izalith_2, and 15 is the cyan character-shaped row the bible names for the DR3 de-sheen. Sized from row 42 at great_hollow (envDif -50 / envSpc -150 gave char -0.29): predicted d_char_env -0.10..-0.20 if row 15 is live, 0 if not (then the row is 8). If DR3 or izalith_1 characters also stand on row 15 they dim slightly; neither has a character target"

