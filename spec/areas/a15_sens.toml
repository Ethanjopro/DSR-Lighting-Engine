why = "sens/sens_bridge: map row 0 fill cut at the gentle end of x0.8-0.9; shared with 12 Anor Londo objects and sens is a pinned dark view (parish-like), where x0.85 risks passing the -0.40 EV floor"

[[edit]]
bank = "LightBank"
slot = 0
rows = [0]
op = "set"
fields = { envDif_colA = 110 }
why = "sens: map row 0 envDif 120 -> 110 (gentle end of 100-110, same EV-floor reason as the ambient cut)"

[[edit]]
