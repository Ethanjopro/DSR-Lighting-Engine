# Global lighting-model rules, enforced by tools/validate.py.
# Starting values from the approved plan; W1 (look bible + global model) refines them.
# rel = allowed new/vanilla ratio, abs = allowed |new - vanilla|. Applies per changed field per row.

[immutable]
# Baked lightmaps fix the light rig; cubemap IDs index textures and must never change.
LightBank = ["degRotX_0", "degRotY_0", "degRotX_1", "degRotY_1", "degRotX_2", "degRotY_2",
             "degRotX_s", "degRotY_s", "envDif", "envSpc_0", "envSpc_1", "envSpc_2", "envSpc_3"]
# Session 3 (data/session3_ab.json): zeroing every s_LightBank intensity changed nothing in game, so the
# engine does not read it in gameplay. It stays vanilla.
s_LightBank = ["*"]
# Unswept fields are frozen until a sweep says what they do (looks/README.md P5-P8).
ShadowBank = ["lightDegRotX", "lightDegRotY", "densityRatio", "colR", "colG", "colB", "beginDist", "calibulateFar",
              "persedDepthOffset", "shadowVolumeDepth"]
LightScatteringBank = ["sunRotX", "sunRotY", "distanceMul", "lsHGg", "lsBetaRay", "lsBetaMie",
                       "reflectanceR", "reflectanceG", "reflectanceB", "reflectanceA"]
FogBank = ["fogBeginZ", "fogEndZ", "degRotZ"]
ToneMapBank = ["adaptSpeed", "bloomBegin", "bloomBeginFar", "bloomNearDist", "bloomFarDist", "lightShaftBegin",
               "lightShaftAttenRate", "inverseToneMapMul"]
ToneCorrectBank = ["hue", "sfxMultiplier"]
EnvLightTexBank = ["*"]
LensFlareBank = ["*"]
LensFlareExBank = ["*"]
PointLightBank = ["*"]      # the player lantern is out of scope for v1
LodBank = ["*"]
DofBank = ["*"]

# --- Bands ---------------------------------------------------------------------------------
[[band]]
bank = "LightBank"
fields = ["colA_0", "colA_1", "colA_2"]
rows = "map"            # rows used by map pieces/objects (lightmaps baked against these)
# Vanilla 421b shaders ignore dir lights entirely (sweep: colA_0 x2 = no change). The band stays because the
# sun prototype may read these rows; rotations stay immutable so a runtime sun agrees with baked shadows.
rel = [0.8, 1.2]

[[band]]
bank = "LightBank"
fields = ["colA_u", "colA_d"]
rel = [0.6, 1.4]

[[band]]
bank = "LightBank"
fields = ["colR_0", "colG_0", "colB_0", "colR_1", "colG_1", "colB_1", "colR_2", "colG_2", "colB_2",
          "colR_u", "colG_u", "colB_u", "colR_d", "colG_d", "colB_d", "colR_s", "colG_s", "colB_s"]
abs = 40

[[band]]
bank = "LightBank"
fields = ["envDif_colA", "envSpc_colA"]
rel = [0.5, 1.5]

[[band]]
bank = "LightBank"
exact_bank = true       # c6 is read from LightBank, not s_LightBank (data/probe_constants.json)
fields = ["colA_s"]
# colA_s is the sun-strength knob (shader carrier c6 = (col_s/255 * colA_s/100)^2.2; sun radiance = 2 x c6,
# capped at 0.6 in the shader, reached at colA_s 58). 0 = no sun (interiors). Water specular follows it.
# Vanilla values are water-specular settings, not sun intent (data/sun_ab.json), so this is a range, not a ratio.
max = 60

[[band]]
bank = "LightBank"
fields = ["envDif_colR", "envDif_colG", "envDif_colB", "envSpc_colR", "envSpc_colG", "envSpc_colB"]
abs = 40

[[band]]
bank = "LightScatteringBank"
fields = ["sunA"]
rel = [0.7, 1.3]        # scatter x2 = +0.27..+0.74 EV and +2.5 clip at Firelink

[[band]]
bank = "LightScatteringBank"
fields = ["sunR", "sunG", "sunB"]
abs = 40

[[band]]
bank = "LightScatteringBank"
fields = ["blendCoef"]
abs = 10

[[band]]
bank = "ToneCorrectBank"
fields = ["contrastR", "contrastG", "contrastB"]
abs = 0.03              # sweep: +0.10 gave -0.5..-2.9 EV and heavy crush (data/sweep_sensitivity.json)

[[band]]
bank = "ToneCorrectBank"
fields = ["saturation"]
rel = [0.9, 1.15]

[[band]]
bank = "ToneCorrectBank"
fields = ["brightnessR", "brightnessG", "brightnessB"]
rel = [0.85, 1.15]

[[band]]
bank = "ToneMapBank"
fields = ["grayKeyValue"]
rel = [0.7, 1.3]

[[band]]
bank = "ToneMapBank"
fields = ["minAdaptedLum"]
rel = [0.6, 1.4]        # sweep: x3 gave -1.0..-4.4 EV

[[band]]
bank = "ToneMapBank"
fields = ["maxAdapredLum"]
rel = [0.5, 2.0]

[[band]]
bank = "ToneMapBank"
fields = ["bloomMul", "bloomMulFar"]
rel = [0.5, 1.5]

[[band]]
bank = "ToneMapBank"
fields = ["lightShaftPower"]
max = 0.10              # vanilla anchors (m10 rows 4/10/52) use 0.01-0.03

[[band]]
bank = "ShadowBank"
fields = ["endDist"]
rel = [0.5, 2.0]        # perspective shadow maps trade resolution for range

[[band]]
bank = "FogBank"
fields = ["colA", "degRotW"]
rel = [0.6, 1.6]

[[band]]
bank = "FogBank"
fields = ["colR", "colG", "colB"]
abs = 40

# --- Readability floor ---------------------------------------------------------------------
# Darkest-scene exposure cap ~ grayKeyValue / minAdaptedLum. Never more than this many EV below vanilla's cap.
# The plain ratio underestimates the on-screen effect: minAdaptedLum x3 (1.58 EV by ratio) measured up to
# 4.37 EV in Undead Parish, so the predicted drop is multiplied by model_gain (worst measured case).
[readability]
max_ev_below_vanilla = 1.0
model_gain = 2.8

# --- Lockstep ------------------------------------------------------------------------------
[lockstep]
ratio_tolerance = 0.10  # char rows / s_LightBank rows must track their map row's change ratio within +-10%
s_lightbank_same_id = false  # s_LightBank is immutable (unused by the engine)
# colA_s is per-row sun intent, so it is excluded from all lockstep checks. s_ fields that are 0 in vanilla are
# skipped; small integer s_ fields pass when they equal round(old x ratio). A LightBank colA field going from 0 to
# nonzero must be listed in the area spec's from_zero, or it is an error.
# A [[lockstep]] declaration may set char_rel = [lo, hi]: char ratio / map ratio must lie in it (dim, never boost).

# --- Shadow fade ---------------------------------------------------------------------------
[shadow_fade]
# The sun fades with the shadow fade, so fadeBeginDist / fadeDist scale with endDist (same ratio).
ratio_tolerance = 0.10

# --- Sun decisions -------------------------------------------------------------------------
[sun]
# Every live LightBank row with 0 < vanilla colA_s <= spec_only_above needs an explicit decision in its area spec
# (a colA_s edit or a [[sun_keep]] entry); missing ones are warnings. Rows above it are water/lava specular rows
# that the shader leaves out of the sun.
decisions_required = true
spec_only_above = 60

# --- Capture guardrails (defaults; looks/targets.json overrides them per view) -------------
[guardrails]
ev_abs = 0.3
clip_max_delta = 1.0
crush_max_delta = 3.0

[transitions]
max_extra_jump_ev = 0.3
