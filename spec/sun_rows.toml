# The v4 key light, row by row. tools/build_v4.py reads this after the 1.0 area specs and writes LightBank _s.
#
# How the row decides the light (engine: shaders/features/dsrle_features.fxh):
#   c6 = (colRGB_s/255 * colA_s/100)^2.2, radiance = c6 * lighting.sun_gain (14), direction = ShadowBank c73.
#   The row has a sun when 0 < max(c6) <= 0.33. A white colA_s 60 is 0.325, 61 is 0.337 and gets no sun.
#   A sun row also gets the lower fill (0.6 against 0.85) and world shadows, so a token sun is darker than none:
#   nothing here is below 25.
#
#   colA_s      60    55    50    45    40    35    30    25
#   c6        .325  .268  .218  .172  .133  .099  .071  .047
#   radiance  4.55  3.76  3.05  2.41  1.87  1.38  0.99  0.66
#
# Each group has one of four states:
#   on      sun: strength = colA_s 1..60, colour = [r, g, b], "key" (the row's own _0 light) or "key:N" (row N's _0).
#           The build scales the colour so its largest channel is 255, because strength is the only brightness knob:
#           a dark key such as 155/55/55 would otherwise cut a 30 to about 18.
#   off     no sun: colA_s 0. Any specular on the row goes too, so no row with known water and a vanilla value is off.
#   keep    no sun: _s stays as it is, above 60. Water and lava keep their specular.
#   water   no sun: colA_s 61, just over the gate. For rows that vanilla left at 60 or below, carry water and sit where
#           no sun belongs: 0 would strip the sheen and keeping the value would light the room. The sheen comes out
#           stronger than vanilla (x1.55 from 50, x4.8 from 30, x11.6 from 20), still far under the 100-300 water rows.
#
# Strength is by sky, not by colA_0 (Anor's outdoor row is 70, the Kiln's character row is 510). The screen sees
# radiance * exposure, and exposure bottoms out at grayKey / maxAdapredLum, so rows are read against their ToneMap:
# Firelink 2.25, Burg 1.35, Darkroot 1.08 (locked), Sen's 1.0, Kiln and Asylum about 0.8, Anor 0.5, Painted 0.2.
# Lowest screen key of the main rows, as set here: Firelink 4.20, Burg 4.11, Darkroot 2.0, Anor 1.88, Sen's 1.86, Asylum 1.60,
# Archives 1.49, Sanctuary 1.46, Kiln 1.0, Royal Wood 0.90, Ash Lake 0.88, dark Anor 0.79, Township 0.67, Painted 0.61.
#
# Within one place, a shade row takes the same strength as its open row. World shadows now do what the authored shade
# rows did, so a lower value counts the shade twice: a crate in the sunbeam gets less than the ground beside it, and
# G5 cites an unverified report that LightBank rows do not blend, so a character could pop at the collision edge. If a
# shade row leaks in a capture, drop that row a step. Trees are different: they are lower for how foliage takes light.
#
# How water rows are known. No per-mesh list is in the repo, so this is a reading of what is:
#   1. The W3 water census quoted in spec/areas (mesh and material): a10 13 (m2400B1), a11 2 (m2100B0, m2101B0),
#      a13 3 (m2301B0), a15 0 and 2 (m0000B0), a16 2 (m3300B0, m3700B0), a18 20 (m0030B1, m0070B1), a18 22 (m0300B1);
#      [[sun_keep]] adds a10 10 and 20, a11 0. It also clears a10 0/1/5/11/14/21/26/28/29/33/36/40, a11 1,
#      a14 14/20/28/29, a16 3/4/5 and the other a18 rows. G5 adds a16 1.
#   2. Row names: a13 15, 16, 17, 28, 29.
#   3. Vanilla colA_s above 60 on a row with map pieces: a10 2/3/4, a12 0/1, a16 0. A hint only: a12 4 is trees, a12 36 is
#      characters, and nearly every a14 row is 100 whether it holds water or not.
#
# Collision counts tie banks together, because each collision names one row per bank. Where two sums match exactly the
# rows belong together, and notes below cite these: a10 Light 25+27 = Fog 20 (36); a10 Light 15+16+17+36 = Sha 10+11+13
# (116); a18 Light 0+5+7 = Sha 0+16..19 (42) and Light 28..64 = Sha 24+25+26 (35); a16 Light 0+10 = Fog 0 (22);
# a12 Light 0+10 = Fog 0 (191); a17 Light 13+25 = Fog 3 (8); a13 Ton 18+19+39+40 are all m13_02.
# These are counts, and they assume a row's collisions stay together. That fails at least once: a18 Sha 24 holds 2 collisions
# and no Asylum rows add up to 2. So a count that places a row is evidence, not proof, and nothing here has been probed.

