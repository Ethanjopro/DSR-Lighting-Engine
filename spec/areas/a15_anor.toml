# Round 2: the round-1 char-row cuts (31 colA 25/15 -> 22/13 and envSpc 180 -> 135; 33 colA 35/17 -> 31/15) are
# removed. Round 1 measured anor_interior char -0.81/-0.80 (two captures, repeat +0.05) vs -0.40..0: the sun-off on
# rows 31/33 alone takes the re-baseline leak away (sun_ab +0.21..+0.25 on the box; the armour pixels fell 1-2.5 EV),
# and the row-23 walls inside the box fell too. A partial ease still models below -0.40; the char row (31 or 33) is
# not identifiable from the capture, so both go back to vanilla. Restored Lighting kept DSR's specular on purpose,
# so the envSpc cut also went against the cited source. G4 predicted char -0.30..-0.38 (sun-off + walls only); the
# round-2 cross-check widens it to -0.36..-0.55, because the sun share of the crop is 0.30-0.35 by sun_ab (scaled to
# the CHAR box) but 0.50 by Phase-0 vs re-baseline, and the row-23 ease recovers less on the sweep slope. Judge on
# both captures; do not widen the char target before this cuts-removed capture exists.

[[edit]]
bank = "LightBank"
slot = 0
rows = [23]
op = "set"
fields = { envDif_colA = 250 }
why = "anor_interior flat fill, eased in round 2: row 23 envDif 280 -> 250 (x0.89, top of 200-250; round 1 was 225 = x0.80). Round 1 measured frame ev -0.52 (two captures, repeat 0.003) vs -0.45..-0.05: sun-off -0.06 (sun1 and Phase-0 agree), char rows ~-0.03, row 23 ~-0.42 for log2 x0.80 = -0.31, i.e. ~1.3 EV per halving in the cut direction (the x2 sweep read 0.6). Half the log cut predicts ev -0.27..-0.31 and sat x1.084 -> ~x1.05 before the ToneCorrect 11 edit; on the sweep slope (+0.597 per doubling) the ease recovers only ~0.09, so the round-2 cross-check predicts ev -0.27..-0.43 (still inside -0.45). s_LightBank is immutable"

[[edit]]
