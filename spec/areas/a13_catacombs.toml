# G3 round 1 (W3 draft, before measurement): Catacombs (m13_00) plus the a13 rows shared by all of m13.
# Sources: looks/G3.md sections 3-5, looks/README.md sections 4 and 8, looks/targets.json.
area = "a13"

# --- Sun decisions (README 4.3 rule 7 / P9) ---------------------------------------------------
# Every live a13 row with 0 < vanilla colA_s <= 60 is 0, 1, 3, 20 or 38 (all 50). In vanilla only the Water
# shaders read c6, so 0 is look-neutral except on row 3 (one A13_Water_lake[We] mesh, m2301B0).
[[edit]]
bank = "LightBank"
rows = [0, 1, 3, 38]
op = "set"
fields = { colA_s = 0 }
why = "sun off in the crypt (catacombs_entrance, catacombs, tomb_1/2 enemies on row 0): G3 'turn the sun off in every cave'; row 0 also spans m13_01/m13_02 objects and characters, row 38 = boss character row. Row 3 = Pinwheel boss room (5 pieces, 24 objects, not a checked view) carries one A13_Water_lake[We] mesh (m2301B0) that loses its vanilla c6 specular at 0. USER DECISION (W3 fixer default: 0, because a 0.435 sun on 24 objects in a cave boss room breaks 'caves off'); the alternative is a [[sun_keep]] on row 3. W4: one-row water A/B on row 3 before shipping"

[[edit]]
bank = "LightBank"
rows = [20]
op = "set"
fields = { colA_s = 0 }
why = "sky dome (M[D]_Alp, no light map, all three m13 maps): no sun on a sky in a cave map; non-water, so vanilla-neutral"

# --- Fill: separation from less fill, not crush (G3 section 4) --------------------------------
# LightBank 0 is shared by every m13 map (148 Catacombs map pieces, 290 objects, 265 characters); README 8 allows
# colA_d and the sun only. colA_u stays (G3 recipe).
[[edit]]
bank = "LightBank"
rows = [0]
op = "mul"
fields = { colA_d = 0.875 }
why = "catacombs/catacombs_entrance ev -0.35..+0.05: cut the generous lower fill (50 -> 44); also dims row-0 enemies/objects in the Tomb, Great Hollow and Ash Lake (lower hemisphere only)"

[[edit]]
bank = "LightBank"
rows = [10]
op = "mul"
fields = { colA_u = 0.9 }
why = "catacombs_entrance ev -0.35..+0.05, p90 -10..+3: less flat sky fill on the outer stone (120 -> 108), lit stone and flame pools hold"

