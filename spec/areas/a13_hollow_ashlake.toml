# G3 round 1 (W3 draft, before measurement): Great Hollow and Ash Lake (m13_02).
# Sources: looks/G3.md sections 6-7, looks/README.md sections 2, 4 and 8, looks/targets.json.
area = "a13"

# --- Great Hollow: character de-sheen on character row 42 (36 collisions, places 1320/1321) ----
# envDif/envSpc are not lockstepped; the s_ copies are mirrored so the edit holds whichever bank the engine reads.
# W4 round 1 resolved the probe gate: the same edit moved the great_hollow character by -0.32 / -0.26 (d_char_env
# -0.31 / -0.24, inside -0.50..-0.10) and the ash_lake character by 0.000 (static pixels). So the ash_lake bonfire
# character is not on row 42, the two d_char_env targets do not conflict, and row 42 stays as is.
[[edit]]
bank = "LightBank"
rows = [42]
op = "mul"
fields = { envDif_colA = 0.875, envSpc_colA = 0.7 }
why = "great_hollow d_char_env -0.5..-0.1: cut the cool sourceless armour sheen (envDif 400 -> 350, envSpc 500 -> 350; envSpc stays above x0.6)"

# W4 round 1: this sun moved nothing measurable at ash_lake (frame +0.000, character crop -0.004 / -0.000, static
# character pixels median 0.000). Either the bonfire character is not on row 18, or the zenith ShadowBank 0 sun
# reaches only its top faces (N.L ~ 0 on vertical faces); the light-mapped sand gets no sun under SUN_A. Raising colA_s
# would not fix either cause. Kept for the declared 'low' class (passes; tomb_1/2 did not move). A c7/c8 tint probe of
# rows 18/19/39/40 at ash_lake would settle which row lights the bonfire character.
[[edit]]
bank = "LightBank"
rows = [18]
op = "set"
fields = { colA_s = 20, colR_s = 240 }
from_zero = true
why = "ash_lake sun low (radiance ~0.058) from the bright mist overhead: a little form on the character and Hydra, d_char_env -0.05..+0.25, clip <= +0.5"
