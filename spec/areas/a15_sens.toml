# --- Grade: pay back part of the saturation the fill cut adds ---------------------------------------------
[[edit]]
bank = "ToneCorrectBank"
slot = "both"
rows = [0]
op = "set"
fields = { saturation = 0.94 }
why = "sens sat x1.123 (repeat x0.999) vs 0.98..1.10: cutting the row-0 fill removes grey fill (x1.035 of it is only the removed re-baseline sun leak on the corridor wall: Phase-0 sat 0.3824 vs re-baseline 0.3694). Saturation 1.0 -> 0.94 (band 0.9-1.15) partly compensates: simulated on the round-1 frames sens x1.087, sens_bridge x1.025 -> x0.986 (it shares ToneCorrect 0 and also rose, +0.015 abs), oklab moves <= 0.0011. Row inferred from the collision pairing (header); if round 2 shows sens sat unmoved, the view is on ToneCorrect 1 instead. Slot both: slot 1 mirrors ToneCorrect 0 in vanilla, and no m15_01 collision selects it"

[[edit]]
bank = "ShadowBank"
slot = 0
rows = [0]
op = "mul"
fields = { endDist = 1.5, fadeBeginDist = 1.5, fadeDist = 1.5 }
why = "sens_bridge: Shadow 0 endDist 40 -> 60 (55-70; lower-middle for the fortress-wall shimmer check), fades scaled with it; no m15_01 collision uses Shadow 0"
[[sun_keep]]
