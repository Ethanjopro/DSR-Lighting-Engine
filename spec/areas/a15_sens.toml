# G4 round 1: Sen's Fortress (m15_00; LightBank rows 0-12, slot 0). Sources: looks/G4.md, looks/README.md,
# looks/targets.json (sens, sens_bridge). Drafted before measurement; W4 captures and iterates.
#
# Runtime sharing (per-map MSB census, 2026-10-30): no m15_01 collision selects ToneMap 0, ToneCorrect 0 or
# Shadow 0, so those rows only reach Sen's at runtime. LightBank 0 is really shared: 12 Anor Londo objects
# (o5860-o5871, o5910) use it, so the row-0 fill cut and sun below also land on them (cross-check anor_entrance).
area = "a15"

# --- Sun (P9 decisions for every live Sen's row in slot 0) ------------------------------------------------
# Rows 0/10 at 33 are a DELIBERATE COMPROMISE, not a class value (W3 fixer): sens wants low (~25) and sens_bridge mid
# (~40), and both views sit on rows 0 and 10. After the c6 one-row probe: 25 if the sens bonfire is on them, 40 if
# only sens_bridge is. Row 0 also lights 12 Anor Londo objects (o5860-o5871, o5910): check them in the three Anor
# captures after the first Sen's edit.
[[edit]]
bank = "LightBank"
slot = 0
rows = [10]
op = "set"
fields = { colA_s = 33, colR_s = 245, colG_s = 250 }
why = "sens (low) / sens_bridge (mid) compromise on the shared outdoor char row 10: 33 = radiance ~0.17; cool-neutral 245/250/255 following the row's cool baked key 220/240/255 (README 4.3 rule 1, W3 fixer)"

[[edit]]
bank = "LightBank"
slot = 0
rows = [3]
op = "set"
fields = { colA_s = 20 }
why = "sens_bridge sun: cliff and middle-ground rows get low 15-25 (middle 20), weaker than the walkway"

[[edit]]
bank = "LightBank"
slot = 0
rows = [4]
op = "set"
fields = { colA_s = 15 }
why = "sens_bridge sun: trees row 4 at most 15, foliage beyond the shadow range would be lit flat"

[[edit]]
bank = "LightBank"
slot = 0
rows = [1, 11, 12]
op = "set"
fields = { colA_s = 0 }
why = "sun off: row 1 = indoor no-lightmap objects, rows 11/12 = indoor and shade char rows (sens: always 0)"

