; DSR Lighting Engine settings. The game picks up changes to this file while it runs.

[engine]
enabled = 1          ; 0 = plain game, everything below off. An HDR swap chain stays until the game restarts
toggle_key = 121     ; virtual-key code that flips the engine on and off in game (121 = F10); 0 = no key
quality = 0          ; 3 = everything as set below, 2 and 1 = lower limits for slower video cards, 0 = picked from the card's memory
notices = 1          ; a line of text on screen when the game starts, when the key above is pressed, and if the engine has to turn itself off

[dev]
dump_unknown = 1     ; keep copies of shaders not found in the game's archives

[gtao]
enabled = 1
radius = 2.5         ; world units reached by the occlusion search
falloff = 0.6        ; part of the radius over which occluders fade out
power = 1.8                   ; strength curve; higher is darker
slices = 4
steps = 6
max_pixels = 280     ; screen-space cap on the search radius
thickness = 0.35     ; thin objects stop occluding sooner when raised
fade_start = 120     ; distance where AO starts fading out
fade_end = 400
contact_length = 0.7 ; sun contact shadow: world units marched toward the sun; 0 = off
contact_fade = 50    ; distance where it has faded out

[lighting]
enabled = 1          ; engine versions of the game's forward shaders
sun_gain = 14        ; key light strength; each area's sun colour and intensity scale this
fill_probe_sun = 0.6 ; probe fill where an area has a sun; lower is more contrast
fill_hemi_sun = 0.6 ; hemisphere fill where an area has a sun
fill_probe_dark = 1 ; probe fill indoors and at night; lower makes unlit rooms darker
fill_hemi_dark = 1 ; hemisphere fill indoors and at night
point_gain = 1.6     ; torch, bonfire and other point light strength
point_falloff = 0.18 ; part of a light's reach where it has dropped to half; lower is brighter close up, dimmer far away
ao_on_points = 1     ; how much AO also darkens point light; vanilla is 0
bent_normal = 1      ; how far ambient light follows the open part of each surface's hemisphere; 0 = along the surface normal
ao_bounce = 1        ; light bouncing inside creases, stronger on pale materials; 0 = AO counts every bounce as lost
contact_shadow = 1   ; strength of the sun contact shadow
baked_gate_gain = 8   ; on baked surfaces the bake still gates the sun: saturate(bake * gain) ^ power
baked_gate_power = 0.6

[sunshadow]
enabled = 1          ; world geometry casts real-time sun shadows
world_strength = 0.3 ; how much a cast shadow also dims the probe light; the sun itself is always shadowed
lit_strength = 0.3   ; the same on baked surfaces
far0 = 12            ; the four cascades' far distances
far1 = 40
far2 = 120
far3 = 350
cascade_size = 4096
normal_offset = 2.5  ; in texels, against shadow acne
filter_radius = 2.5  ; in texels: edge softness
caster_reach = 60    ; how far toward the sun a caster can stand: ruins cast, distant cliffs do not
behind = 800         ; depth range past each cascade centre
draws_per_cascade = 400 ; a cascade draws at most this many stored casters, largest first
min_caster_texels = 2 ; casters smaller than this in a cascade's texels are skipped

[casters]
enabled = 1          ; keep the world seen so far, so shadows do not depend on what the camera sees
warp_distance = 200  ; metres the camera may jump in a frame before everything is dropped
max_draws = 6000     ; stored draws; past this the longest unseen go first
keep_distance = 700  ; stored draws farther than this from the camera are dropped
idle_frames = 120    ; frames with nothing drawn, as in a loading screen, before the store lets go of the old map

[pointshadow]
enabled = 1          ; torches, bonfires and other lights cast real-time shadows
strength = 1         ; how dark a shadowed pixel gets; 0 leaves every light as it was
max_lights = 8       ; lights with a shadow, at most 16; each takes 2 x 6 x face_size^2 x 4 bytes of video memory
face_size = 1024     ; resolution of one cube face
faces_per_frame = 6  ; world faces rendered per frame, at least 6
dynamic_draws = 400  ; character and foliage draws per frame
normal_offset = 2    ; in texels, against shadow acne
filter_radius = 1.5  ; in texels: edge softness
bias = 0.01          ; metres toward the light
near = 0.5           ; metres: nearer geometry never casts, which spares a torch its bracket and a bonfire its sword
move_tolerance = 0.25 ; metres a light moves before its shadow is rendered again
player_distance = 8  ; the player's own light: within this far of the camera...
player_radius = 4.5  ; ...and no larger than this, a light casts nothing until shown to stay put

[lightreach]
enabled = 1
reach = 1.8          ; torches and fires reach this many times farther; 1 = the game's own small lights
max_radius = 18      ; metres
stretch_limit = 4    ; metres of a light that get stretched: large lights were already placed to fill a room
full_distance = 18   ; lights this close to the camera get the full reach; only the nearest have shadows, so far ones stay small
none_distance = 36

[volumetrics]
enabled = 1          ; light in the air: shafts from the sun, glow around torches and bonfires
strength = 1
sun = 0.00008               ; sun scatter per metre: the light shafts
light_density = 0.003 ; how much the air glows around lights
glow_core = 0.8      ; metres: the glow falls off as an inverse square outside this core
max_glow = 0.05            ; soft limit on the local-light glow
haze_density = 0.00005 ; faint haze in the area's fog colour; dark areas lift quickly if this is raised

[maps]
enabled = 1          ; some maps use their own values, from maps.ini and any [map.*] section here; 0 = the values above everywhere
apply = 1            ; 0 = work out the map and log it, but keep the values above
blend_seconds = 1.5  ; how long the values take to ease from one map's to the next
log = 0              ; 1 = log what the map detection sees, once a second
confirm_frames = 6   ; frames in a row a new map must be seen before its values start
load_frames = 30     ; frames in a row with no lit world drawn that count as a loading screen
snap_seconds = 2     ; for this long after a load, values switch at once instead of easing
c73_share = 0.75     ; the share of the lit world's draws that must agree on the sun's direction; less keeps the values above
min_votes = 3        ; draws of a map's own geometry in one frame before it counts as seen, at least 1
dominance = 4        ; and they must outnumber draws of a rival map behind a loading screen this many times
walk_share = 0.25    ; where a map you can walk into could show a frame like this one's, this map's draws must be this share of all
hold_frames = 900    ; frames without any of its own geometry before a map kept on shared light lets go
; Your own values for one map. A key here wins over maps.ini, which every install replaces. Only these four maps can
; have values: m10_00 Depths, m10_01 Undead Burg and Parish, m12_00 Darkroot Garden and Basin, m15_01 Anor Londo.
; [map.m10_01]
; lighting.point_gain = 1.2

[bloom]
enabled = 1          ; wide bloom from the whole scene, on top of the game's own
strength = 0.08      ; share of the image that scatters
scatter = 0.75       ; 0 tight .. 1 very wide

[ssgi]
enabled = 1          ; bounce light: lit surfaces colour what faces them, from what is on screen
strength = 2         ; 1 is one physical bounce
gate = 0.85          ; surfaces only receive what is brighter than their own surroundings, so unlit rooms stay dark
gate_mip = 5         ; how wide those surroundings are: each step up doubles it, 5 is about 128 screen pixels
radius = 8           ; metres a bounce reaches
rays = 4             ; rays per traced pixel
steps = 12           ; steps per ray
thickness = 0.6      ; metres behind a surface that still count as hitting it
downscale = 2        ; screen pixels per traced pixel, 2 or 4
max_radiance = 2     ; the brightest a surface can bounce at; stops single bright pixels flickering
sky_weight = 0.02    ; how much of the sky's colour counts; the probes already carry the sky
sky_z = 1000         ; metres past which a pixel counts as sky
max_gi = 3           ; soft ceiling on the result
history = 16         ; frames of accumulation; a change in the light takes this long to arrive
denoise_passes = 3   ; blur passes, 1 to 3
fade_start = 60      ; metres: the bounce fades from here
fade_end = 150       ; to nothing here
normals = 0          ; 0 from depth, 1 from last frame's G-buffer where one exists
warp_distance = 10   ; metres in one frame past which history is dropped

[composite]
enabled = 1          ; highlight roll-off, filmic contrast and dither; 0 is the game's own tonemap, and also turns off the rest of this section, [bloom] and HDR highlights
exposure = 1         ; the whole image
dark_exposure = 1.35 ; extra exposure in very dark scenes, past the game's limit; 1 = the game's own limit
film_shadow = 1.12   ; contrast below mid grey; 1 = none. Near black is left alone either way
film_highlight = 1.12 ; contrast above mid grey; 1 = none
black_floor = 0.03   ; the darkest pixels fade toward black under this instead of clipping; 0 = hard clip

[hdr]
enabled = 1          ; 1 = native HDR when the display reports HDR, 0 = off. Takes full effect when the game starts
paper_white = 200    ; nits of SDR white: the UI and everything below the highlights
peak_nits = 0        ; nits the highlights reach; 0 = what the display reports
warm_hue = 0.5       ; how much of its SDR hue fire keeps above paper white; 0 lets it go redder

[reflect]
enabled = 1          ; screen-space reflections on smooth surfaces and water
strength = 1         ; 0 leaves surfaces as they were; 1 swaps the probe's reflection for the traced one wherever a ray hits
rough_full = 0.4     ; surfaces at or under this roughness get the full effect
rough_cut = 0.7      ; from this roughness up there is no effect at all: rough stone stays as it was
gain = 1             ; on the reflectance; 1 conserves energy
max_distance = 400   ; metres a ray may travel; Anor Londo's floors reflect buildings a long way off
steps = 64           ; pyramid steps per ray
thickness = 0.25     ; metres a ray may be behind a surface and still count as hitting it
history = 0.92       ; share kept from the previous frame; lower if reflections smear behind moving things
water = 1            ; screen-space reflection in water; 0 leaves water as it was
water_cube = 1       ; where water's planar reflection was not rendered, use the area's cube instead of its near-black clear
debug = 0            ; 1 traced light, 2 confidence, 3 roughness, 4 reflectance, 5 what a hit takes out: probe specular and haze
